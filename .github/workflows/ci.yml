name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          prune-cache: true
      - run: uv sync --all-extras --group dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src/matic_sdk
      - run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 uv run pytest -p pytest_asyncio.plugin
      - run: uv run python -m build
      - name: Smoke-test base wheel
        run: |
          uv venv .base-wheel-venv
          wheel_path=$(realpath dist/*.whl)
          uv pip install --python .base-wheel-venv/bin/python "$wheel_path"
          .base-wheel-venv/bin/matic --version
          .base-wheel-venv/bin/matic collections list
          .base-wheel-venv/bin/matic collections decode --help
          .base-wheel-venv/bin/python -c "import matic_sdk; assert len(matic_sdk.KNOWN_TARGETS) == 43; assert callable(matic_sdk.collection_model_to_dict)"
      - name: Smoke-test source distribution
        run: |
          uv venv .sdist-venv
          sdist_path=$(realpath dist/*.tar.gz)
          uv pip install --python .sdist-venv/bin/python "$sdist_path"
          .sdist-venv/bin/matic --version
          .sdist-venv/bin/python -c "import matic_sdk; assert len(matic_sdk.KNOWN_TARGETS) == 43"
      - name: Smoke-test built wheel
        run: |
          uv venv .wheel-venv
          wheel_path=$(realpath dist/*.whl)
          uv pip install --python .wheel-venv/bin/python "$wheel_path[all]"
          .wheel-venv/bin/matic --version
          .wheel-venv/bin/matic collections decode --help
          .wheel-venv/bin/python -c "import matic_sdk; from matic_sdk.cli import _messages; from matic_sdk.maps import SUPPORTED_MAP_TARGETS; assert len(matic_sdk.KNOWN_TARGETS) == 43; assert callable(matic_sdk.collection_model_to_dict); assert 'map_integrated' in SUPPORTED_MAP_TARGETS"

  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: python tools/scan_repository.py
