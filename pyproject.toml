[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "unofficial-matic-sdk"
version = "0.1.0a3"
description = "Unofficial Python SDK and CLI for owner-controlled Matic robots"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Burgess Software LLC" },
]
keywords = ["home-automation", "matic", "robotics", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Home Automation",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "h2>=4,<5",
  "hpack>=4,<5",
  "platformdirs>=4,<5",
  "typer>=0.15,<1",
]

[project.urls]
Homepage = "https://github.com/Burgess-Software/unofficial-matic-sdk"
Documentation = "https://github.com/Burgess-Software/unofficial-matic-sdk#readme"
Issues = "https://github.com/Burgess-Software/unofficial-matic-sdk/issues"
Repository = "https://github.com/Burgess-Software/unofficial-matic-sdk"

[project.optional-dependencies]
ble = ["bleak>=1,<2"]
maps = ["Pillow>=10,<13"]
all = [
  "bleak>=1,<2",
  "Pillow>=10,<13",
]

[project.scripts]
matic = "matic_sdk.cli:app"

[dependency-groups]
dev = [
  "build>=1,<2",
  "mypy>=2.3,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/matic_sdk"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
